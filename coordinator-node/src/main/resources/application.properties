spring.application.name=coordinator-node

server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# redis config
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
#rabbit config
spring.rabbitmq.host=${SPRING_RABBIT_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBIT_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBIT_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBIT_PASSWORD:guest}

# Desafio del hash para el Proof of Work (numero de ceros iniciales en el hash MD5)
blockchain.mining.default-hash-challenge=000000000
# Numero de transacciones a incluir en cada bloque minado
blockchain.mining.min-transactions-per-block=1
# Numero de transacciones maximas a incluir en cada bloque minado
blockchain.mining.max-transactions-per-block=5000
# Expresion cron para la frecuencia de publicacion de nuevas tareas de mineria
# cada 1 minuto (en el segundo 0 de cada minuto)
blockchain.mining.task-publication-cron=${SPRING_SCHEDULER_CRON_EXPRESSION:*/10 * * * * *}
blockchain.mining.max-retries=3

# Prometheus y Observabilidad
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.mining.block.resolution.time=true
management.metrics.distribution.percentiles-histogram.mining.rabbitmq.latency=true
management.metrics.distribution.percentiles-histogram.mining.block.validation.time=true

# Mode: testing | production
blockchain.mode=${BLOCKCHAIN_MODE:testing}

# Reward source: genesis (fondo finito) | unlimited (ex-nihilo, legacy)
blockchain.reward.source=${BLOCKCHAIN_REWARD_SOURCE:genesis}
logging.level.io.github.resilience4j=DEBUG

# Genesis config
blockchain.genesis.supply=${BLOCKCHAIN_GENESIS_SUPPLY:21000000}
blockchain.genesis.base-reward=${BLOCKCHAIN_BASE_REWARD:50}
blockchain.genesis.halving-interval=${BLOCKCHAIN_HALVING_INTERVAL:10}
blockchain.genesis.system-address=${BLOCKCHAIN_SYSTEM_ADDRESS:SYSTEM_GENESIS}

# Auto-ajuste de dificultad: ventana móvil de tiempos de resolución
blockchain.mining.difficulty-window-size=${BLOCKCHAIN_DIFFICULTY_WINDOW_SIZE:5}
blockchain.mining.difficulty-target-seconds=${BLOCKCHAIN_DIFFICULTY_TARGET_SECONDS:8}
blockchain.mining.max-hash-challenge-length=${BLOCKCHAIN_MAX_CHALLENGE_LENGTH:6}