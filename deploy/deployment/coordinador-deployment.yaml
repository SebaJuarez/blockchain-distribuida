apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodo-coordinador
  namespace: apps
  labels:
    app: nodo-coordinador
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodo-coordinador
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nodo-coordinador
    spec:
      serviceAccountName: blockchain-sa
      # --- SEGMENTACIÓN ---
      nodeSelector:
        role: "app"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # --------------------------------
      containers:
        - name: nodo-coordinador
          image: sebajuarez/coordinador:6cbfe7e
          ports:
            - containerPort: 8080
          # --- LÍMITES DE RECURSOS ---
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          # ---------------------------
          envFrom:
            - configMapRef:
                name: coordinador-config
            - secretRef:
                name: coordinador-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }