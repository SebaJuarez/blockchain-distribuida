apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: node-pool-hpa
  namespace: apps
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: node-pool }
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }