apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nodo-coordinador-hpa
  namespace: apps
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nodo-coordinador }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: External
      external:
        metric: { name: mining_transactions_pending }
        target: { type: AverageValue, averageValue: "200" }